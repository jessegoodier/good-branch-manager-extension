name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to bump the version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  release:
    name: Package and publish release
    # Side-branch releases make the GitHub "latest" tag diverge from main and
    # break subsequent main releases (gh --fail-on-no-commits / compare status).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "${{ inputs.bump }}"
